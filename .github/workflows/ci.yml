name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore backend/OneCart.Api.Tests/OneCart.Api.Tests.csproj
          dotnet restore backend/OneCart.Persistence.Tests/OneCart.Persistence.Tests.csproj
      - name: Run API workflow tests
        run: dotnet test backend/OneCart.Api.Tests/OneCart.Api.Tests.csproj --no-restore --configuration Release
      - name: Run persistence tests
        run: dotnet test backend/OneCart.Persistence.Tests/OneCart.Persistence.Tests.csproj --no-restore --configuration Release

  postgresql-integration:
    name: PostgreSQL commerce and recovery integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: onecart_test
          POSTGRES_PASSWORD: onecart_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onecart_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ONECART_POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=onecart_test;Password=onecart_ci_only;Pooling=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          pg_dump --version
      - name: Restore integration test
        run: dotnet restore backend/OneCart.Persistence.IntegrationTests/OneCart.Persistence.IntegrationTests.csproj
      - name: Run PostgreSQL migration, commerce, and recovery tests
        run: dotnet test backend/OneCart.Persistence.IntegrationTests/OneCart.Persistence.IntegrationTests.csproj --no-restore --configuration Release --filter FullyQualifiedName~PostgreSql

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build

  linux-host-packaging:
    name: Linux systemd and Nginx packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Publish API and build storefront
        run: |
          dotnet publish backend/OneCart.Api/OneCart.Api.csproj --configuration Release --output "$RUNNER_TEMP/onecart-api"
          cd frontend
          npm ci
          VITE_API_BASE_URL=https://shop.example.test npm run build
      - name: Validate Nginx site configuration
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx
          temporary_config="$(mktemp -d)"
          mkdir -p "$temporary_config/logs" "$temporary_config/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$temporary_config/certs/key.pem" \
            -out "$temporary_config/certs/fullchain.pem" -subj '/CN=shop.example.com' -days 1
          sed \
            -e "s#/etc/letsencrypt/live/shop.example.com/fullchain.pem#$temporary_config/certs/fullchain.pem#" \
            -e "s#/etc/letsencrypt/live/shop.example.com/privkey.pem#$temporary_config/certs/key.pem#" \
            deploy/linux/nginx-onecart.conf > "$temporary_config/site.conf"
          cat > "$temporary_config/nginx.conf" <<EOF
          pid $temporary_config/nginx.pid;
          error_log stderr notice;
          events {}
          http { include $temporary_config/site.conf; }
          EOF
          sudo nginx -t -c "$temporary_config/nginx.conf" -p "$temporary_config/"

  linux-host-install:
    name: Linux systemd and Nginx fresh-install rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: onecart_test
          POSTGRES_PASSWORD: onecart-ci-only
          POSTGRES_DB: onecart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onecart_test -d onecart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Publish API and build storefront
        env:
          VITE_API_BASE_URL: https://shop.example.test
        run: |
          dotnet publish backend/OneCart.Api/OneCart.Api.csproj --configuration Release --runtime linux-x64 --self-contained false --output "$RUNNER_TEMP/onecart-api"
          cd frontend
          npm ci
          npm run build
      - name: Install Nginx and jq
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx jq
      - name: Rehearse systemd install, HTTPS proxy, database migration, and first-admin setup
        run: bash deploy/linux/ci-host-install-smoke.sh "$RUNNER_TEMP/onecart-api" frontend/dist

  windows-iis-packaging:
    name: Windows IIS package validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Publish API and build storefront
        shell: pwsh
        run: |
          $apiOutput = Join-Path $env:RUNNER_TEMP 'onecart-api'
          dotnet publish backend/OneCart.Api/OneCart.Api.csproj --configuration Release --output $apiOutput
          if ($LASTEXITCODE -ne 0) { throw 'API publish failed.' }
          Push-Location frontend
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed.' }
          $env:VITE_API_BASE_URL = 'https://api.example.test'
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }
          Pop-Location
          if (-not (Test-Path (Join-Path $apiOutput 'web.config'))) { throw 'ASP.NET Core IIS web.config was not published.' }
          if (-not (Test-Path 'frontend/dist/web.config')) { throw 'IIS SPA rewrite web.config was not included in storefront output.' }
          [xml]$apiConfig = Get-Content (Join-Path $apiOutput 'web.config') -Raw
          [xml]$storeConfig = Get-Content 'frontend/dist/web.config' -Raw
          if (-not $apiConfig.SelectSingleNode("/configuration/location/system.webServer/handlers/add[@name='aspNetCore']")) { throw 'IIS ASP.NET Core handler configuration is missing.' }
          if (-not $apiConfig.SelectSingleNode('/configuration/location/system.webServer/aspNetCore')) { throw 'IIS ASP.NET Core process configuration is missing.' }
          if (-not $storeConfig.SelectSingleNode('/configuration/system.webServer/rewrite')) { throw 'IIS SPA route rewrite configuration is missing.' }
      - name: Rehearse IIS runtime and HTTPS host bindings
        shell: powershell
        run: |
          $iisFeatures = Install-WindowsFeature Web-Server, Web-Mgmt-Tools, Web-Http-Logging, Web-Request-Monitor, Web-Filtering -IncludeManagementTools
          if (-not $iisFeatures.Success) { throw "IIS role installation failed: $($iisFeatures.ExitCode)." }
          Import-Module WebAdministration
          Start-Service W3SVC

          $hostingBundle = Join-Path $env:RUNNER_TEMP 'dotnet-hosting-10.0.4-win.exe'
          Invoke-WebRequest 'https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.4/dotnet-hosting-10.0.4-win.exe' -OutFile $hostingBundle
          $installer = Start-Process -FilePath $hostingBundle -ArgumentList '/install', '/quiet', '/norestart' -Wait -PassThru
          if ($installer.ExitCode -notin @(0, 3010)) { throw "ASP.NET Core Hosting Bundle install failed: $($installer.ExitCode)." }

          $rewriteInstaller = Join-Path $env:RUNNER_TEMP 'rewrite_amd64_en-US.msi'
          Invoke-WebRequest 'https://download.microsoft.com/download/1/2/8/128E2E22-C1B9-44A4-BE2A-5859ED1D4592/rewrite_amd64_en-US.msi' -OutFile $rewriteInstaller
          $rewriteInstall = Start-Process -FilePath msiexec.exe -ArgumentList @('/i', $rewriteInstaller, '/qn', '/norestart') -Wait -PassThru
          if ($rewriteInstall.ExitCode -notin @(0, 3010, 1641)) { throw "IIS URL Rewrite installation failed: $($rewriteInstall.ExitCode)." }

          $apiOutput = Join-Path $env:RUNNER_TEMP 'onecart-api'
          $apiPath = Join-Path $env:ProgramFiles 'OneCart\IIS\api'
          $storePath = Join-Path $env:ProgramFiles 'OneCart\IIS\storefront'
          $dataRoot = Join-Path $env:ProgramData 'OneCart\IIS'
          New-Item -ItemType Directory -Force -Path $apiPath, $storePath, (Join-Path $dataRoot 'media'), (Join-Path $dataRoot 'keys') | Out-Null
          Copy-Item (Join-Path $apiOutput '*') $apiPath -Recurse -Force
          Copy-Item 'frontend/dist/*' $storePath -Recurse -Force

          [Environment]::SetEnvironmentVariable('ASPNETCORE_ENVIRONMENT', 'Production', 'Machine')
          [Environment]::SetEnvironmentVariable('Database__Provider', 'PostgreSql', 'Machine')
          [Environment]::SetEnvironmentVariable('ConnectionStrings__Store', 'Host=127.0.0.1;Port=1;Database=onecart;Username=ci;Password=ci-only', 'Machine')
          [Environment]::SetEnvironmentVariable('Cors__AllowedOrigins__0', 'https://shop.example.test', 'Machine')
          [Environment]::SetEnvironmentVariable('ProductMedia__RootPath', (Join-Path $dataRoot 'media'), 'Machine')
          [Environment]::SetEnvironmentVariable('DataProtection__KeyDirectory', (Join-Path $dataRoot 'keys'), 'Machine')

          New-WebAppPool -Name 'OneCartApi'
          Set-ItemProperty 'IIS:\AppPools\OneCartApi' -Name managedRuntimeVersion -Value ''
          $apiIdentity = 'IIS AppPool\OneCartApi'
          & icacls.exe $apiPath /grant "${apiIdentity}:(OI)(CI)(RX)" /T | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not grant the API pool read access to the published application.' }
          & icacls.exe $dataRoot /grant "${apiIdentity}:(OI)(CI)(M)" /T | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not grant the API pool access to persistent local data.' }
          & icacls.exe $storePath /grant 'IIS_IUSRS:(OI)(CI)(RX)' /T | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not grant IIS read access to the storefront files.' }

          $apiHost = 'api.example.test'
          $storeHost = 'shop.example.test'
          Add-Content -Path (Join-Path $env:windir 'System32\drivers\etc\hosts') -Value "`r`n127.0.0.1 $apiHost`r`n127.0.0.1 $storeHost"
          $certificate = New-SelfSignedCertificate -DnsName $apiHost, $storeHost -CertStoreLocation 'Cert:\LocalMachine\My' -FriendlyName 'OneCart IIS CI'
          $certificateFile = Join-Path $env:RUNNER_TEMP 'onecart-iis.cer'
          Export-Certificate -Cert $certificate -FilePath $certificateFile | Out-Null
          Import-Certificate -FilePath $certificateFile -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null

          function Add-OneCartHttpsSite([string] $name, [string] $hostName, [string] $path, [string] $pool) {
            New-Website -Name $name -PhysicalPath $path -ApplicationPool $pool -Port 8081 -HostHeader $hostName | Out-Null
            New-WebBinding -Name $name -Protocol https -Port 443 -HostHeader $hostName -SslFlags 1
            (Get-WebBinding -Name $name -Protocol https -Port 443).AddSslCertificate($certificate.Thumbprint, 'My')
          }

          Add-OneCartHttpsSite 'OneCartApi' $apiHost $apiPath 'OneCartApi'
          New-WebAppPool -Name 'OneCartStorefront'
          Set-ItemProperty 'IIS:\AppPools\OneCartStorefront' -Name managedRuntimeVersion -Value ''
          Add-OneCartHttpsSite 'OneCartStorefront' $storeHost $storePath 'OneCartStorefront'
          iisreset /restart

          $apiHealthy = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try {
              $health = Invoke-WebRequest "https://$apiHost/health" -UseBasicParsing -TimeoutSec 3
              if ($health.StatusCode -eq 200 -and $health.Content -match '"service":"OneCart.Api"') { $apiHealthy = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $apiHealthy) {
            Get-WebAppPoolState 'OneCartApi' | Format-List | Out-String | Write-Host
            Get-Content (Join-Path $apiPath 'web.config') | Write-Host
            throw 'Published API did not start behind IIS HTTPS.'
          }
          $httpStatus = $null
          try {
            $plainHttp = Invoke-WebRequest "http://${apiHost}:8081/health" -UseBasicParsing -TimeoutSec 10 -ErrorAction Stop
            $httpStatus = [int]$plainHttp.StatusCode
          } catch {
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
              $httpStatus = [int]$_.Exception.Response.StatusCode
            } else {
              throw
            }
          }
          if ($httpStatus -ne 400) { throw "API must reject HTTP traffic with 400, but returned $httpStatus." }
          $store = Invoke-WebRequest "https://$storeHost/" -UseBasicParsing -TimeoutSec 10
          if ($store.StatusCode -ne 200 -or $store.Content -notmatch 'id="root"') { throw 'IIS storefront site did not serve the built SPA over HTTPS.' }

  containers:
    name: Container packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          ONECART_DOMAIN: shop.example.test
          ACME_EMAIL: ci@example.test
        run: |
          mkdir -p secrets
          printf 'ci-only-not-a-secret' > secrets/postgres_password
          printf 'Host=db;Port=5432;Database=onecart;Username=onecart;Password=ci-only-not-a-secret' > secrets/store_connection
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.pitr.yml config --quiet
      - name: Build API image
        run: docker build --file backend/OneCart.Api/Dockerfile --tag onecart-api:ci .
      - name: Build storefront image
        run: docker build --file frontend/Dockerfile --build-arg VITE_API_BASE_URL=https://shop.example.test --tag onecart-storefront:ci .

  deployment-smoke:
    name: Fresh Docker install and recovery smoke test
    runs-on: ubuntu-latest
    env:
      ONECART_DOMAIN: shop.example.test
      ACME_EMAIL: ci@example.test
      ONECART_PROXY_SUBNET: 10.254.240.0/24
      ONECART_CADDY_IP: 10.254.240.2
      ONECART_API_IP: 10.254.240.3
    steps:
      - uses: actions/checkout@v4
      - name: Boot an isolated HTTPS deployment
        run: |
          set -euo pipefail
          mkdir -p secrets
          chmod 700 secrets
          postgres_password="$(openssl rand -hex 32)"
          bootstrap_token="$(openssl rand -hex 32)"
          printf '%s' "$postgres_password" > secrets/postgres_password
          printf 'Host=db;Port=5432;Database=onecart;Username=onecart;Password=%s' "$postgres_password" > secrets/store_connection
          printf '%s' "$bootstrap_token" > secrets/bootstrap_token
          unset postgres_password
          chmod 600 secrets/*
          pitr_dir="$(mktemp -d)"
          pitr_recovery_container=onecart-smoke-pitr-recovery
          pitr_recovery_data_volume=onecart-smoke-pitr-recovery-data
          pitr_recovery_wal_volume=onecart-smoke-pitr-recovery-wal
          compose=(docker compose --project-name onecart-smoke -f docker-compose.yml -f docker-compose.pitr.yml -f docker-compose.smoke.yml)
          cleanup() {
            docker rm --force "$pitr_recovery_container" >/dev/null 2>&1 || true
            docker volume rm "$pitr_recovery_data_volume" "$pitr_recovery_wal_volume" >/dev/null 2>&1 || true
            "${compose[@]}" down --volumes --remove-orphans || true
            rm -rf secrets
            rm -rf "$pitr_dir"
          }
          trap cleanup EXIT

          "${compose[@]}" up --detach --build
          "${compose[@]}" run --build --rm --no-deps -e "ONECART_BOOTSTRAP_TOKEN=$bootstrap_token" smoke-check

          "${compose[@]}" run --rm migrate
          "${compose[@]}" exec --no-TTY db psql --username onecart --dbname onecart --command 'SELECT pg_switch_wal();'
          archived_count=0
          for attempt in $(seq 1 20); do
            archived_count="$("${compose[@]}" exec --no-TTY db psql --username onecart --dbname onecart --tuples-only --no-align --command 'SELECT archived_count FROM pg_stat_archiver;')"
            if [ "$archived_count" -gt 0 ]; then break; fi
            sleep 1
          done
          test "$archived_count" -gt 0
          docker run --rm -v onecart-smoke_postgres-wal-archive:/archive:ro alpine:3.24 sh -ec 'find /archive -type f | grep -q .'

          dump_file="$(mktemp)"
          trap 'rm -f "$dump_file"; cleanup' EXIT
          "${compose[@]}" exec --no-TTY db pg_dump --username onecart --format custom onecart > "$dump_file"
          "${compose[@]}" exec --no-TTY db createdb --username onecart onecart_restore_check
          "${compose[@]}" exec --no-TTY db pg_restore --username onecart --dbname onecart_restore_check --no-owner --no-privileges --exit-on-error < "$dump_file"
          restored_admin_count="$("${compose[@]}" exec --no-TTY db psql --username onecart --dbname onecart_restore_check --tuples-only --no-align --command 'SELECT COUNT(*) FROM "AspNetUsers";')"
          test "$restored_admin_count" = 1

          "${compose[@]}" run --rm --no-deps smoke-check health

          "${compose[@]}" exec --no-TTY db psql --username onecart --dbname onecart --command \
            "CREATE TABLE onecart_pitr_probe (marker text PRIMARY KEY); INSERT INTO onecart_pitr_probe VALUES ('before-base-backup');"
          base_archived_count="$("${compose[@]}" exec --no-TTY db psql --username onecart --dbname onecart --tuples-only --no-align --command 'SELECT archived_count FROM pg_stat_archiver;')"
          "${compose[@]}" exec --no-TTY db rm -rf /tmp/onecart-pitr-base
          "${compose[@]}" exec --no-TTY db pg_basebackup --username=onecart --pgdata=/tmp/onecart-pitr-base --format=plain --wal-method=stream
          mkdir -p "$pitr_dir/base"
          "${compose[@]}" cp db:/tmp/onecart-pitr-base/. "$pitr_dir/base"
          "${compose[@]}" exec --no-TTY db rm -rf /tmp/onecart-pitr-base

          "${compose[@]}" exec --no-TTY db psql --username onecart --dbname onecart --command \
            "SELECT pg_create_restore_point('onecart_before_after_marker');"
          "${compose[@]}" exec --no-TTY db psql --username onecart --dbname onecart --command \
            "INSERT INTO onecart_pitr_probe VALUES ('after-target'); SELECT pg_switch_wal();"

          archived_count="$base_archived_count"
          for attempt in $(seq 1 20); do
            archived_count="$("${compose[@]}" exec --no-TTY db psql --username onecart --dbname onecart --tuples-only --no-align --command 'SELECT archived_count FROM pg_stat_archiver;')"
            if [ "$archived_count" -gt "$base_archived_count" ]; then break; fi
            sleep 1
          done
          test "$archived_count" -gt "$base_archived_count"
          docker run --rm -v onecart-smoke_postgres-wal-archive:/source:ro -v "$pitr_dir:/backup" \
            alpine:3.24 sh -ec 'tar -czf /backup/wal-archive.tar.gz -C /source .'

          "${compose[@]}" stop api storefront db
          docker volume create "$pitr_recovery_data_volume" >/dev/null
          docker volume create "$pitr_recovery_wal_volume" >/dev/null
          docker run --rm -v "$pitr_recovery_data_volume:/target" -v "$pitr_dir/base:/source:ro" \
            alpine:3.24 sh -ec 'cp -a /source/. /target/'
          docker run --rm -v "$pitr_recovery_wal_volume:/target" -v "$pitr_dir/wal-archive.tar.gz:/backup/wal-archive.tar.gz:ro" \
            alpine:3.24 sh -ec 'tar -xzf /backup/wal-archive.tar.gz -C /target'
          cat > "$pitr_dir/recovery-settings.conf" <<EOF
          restore_command = 'cp /var/lib/postgresql/wal-archive/%f %p'
          recovery_target_name = 'onecart_before_after_marker'
          recovery_target_action = 'pause'
          EOF
          docker run --rm -v "$pitr_recovery_data_volume:/data" -v "$pitr_dir/recovery-settings.conf:/settings.conf:ro" \
            alpine:3.24 sh -ec 'touch /data/recovery.signal; cat /settings.conf >> /data/postgresql.auto.conf'
          docker run --detach --name "$pitr_recovery_container" \
            -v "$pitr_recovery_data_volume:/var/lib/postgresql/data" \
            -v "$pitr_recovery_wal_volume:/var/lib/postgresql/wal-archive" \
            postgres:17-alpine

          recovered_state=
          for attempt in $(seq 1 30); do
            recovered_state="$(docker exec "$pitr_recovery_container" psql --username onecart --dbname onecart --tuples-only --no-align \
              --command "SELECT CASE WHEN pg_is_in_recovery() THEN 'true' ELSE 'false' END || '|' || COUNT(*)::text FROM onecart_pitr_probe WHERE marker = 'after-target';" 2>/dev/null || true)"
            if [ "$recovered_state" = 'true|0' ]; then break; fi
            sleep 1
          done
          if [ "$recovered_state" != 'true|0' ]; then
            docker logs "$pitr_recovery_container" || true
            echo "PITR recovery assertion failed; database state: $recovered_state"
            exit 1
          fi
