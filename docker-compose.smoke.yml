services:
  api:
    environment:
      Cors__AllowedOrigins__0: https://${ONECART_DOMAIN:?Set ONECART_DOMAIN in .env}

  storefront:
    build:
      args:
        VITE_API_BASE_URL: https://${ONECART_DOMAIN:?Set ONECART_DOMAIN in .env}

  proxy:
    ports: !reset []
    volumes:
      - ./deploy/Caddyfile.smoke:/etc/caddy/Caddyfile:ro

  smoke-check:
    build:
      context: .
      dockerfile: deploy/Dockerfile.smoke
    image: onecart-smoke-check:local
    profiles: ["smoke"]
    environment:
      ONECART_DOMAIN: ${ONECART_DOMAIN:?Set ONECART_DOMAIN in .env}
    networks:
      - edge
