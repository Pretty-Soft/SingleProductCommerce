services:
  api:
    environment:
      Cors__AllowedOrigins__0: https://${ONECART_DOMAIN:?Set ONECART_DOMAIN in .env}:8443

  storefront:
    build:
      args:
        VITE_API_BASE_URL: https://${ONECART_DOMAIN:?Set ONECART_DOMAIN in .env}:8443

  proxy:
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./deploy/Caddyfile.smoke:/etc/caddy/Caddyfile:ro
